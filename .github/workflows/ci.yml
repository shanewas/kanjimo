name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jstudy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: node --test tests/*.test.js
      # pgserver is skipped: the suite uses the postgres service through JSTUDY_TEST_DATABASE_URL.
      - run: pip install -r server/requirements.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pytest tests/open tests/release -q
      - run: python -m pytest server/tests -q
        env:
          JSTUDY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jstudy_test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production  # a required reviewer approves every deploy
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: SSH key
        env:
          NAVI_SSH_KEY: ${{ secrets.NAVI_SSH_KEY }}
          NAVI_KNOWN_HOSTS: ${{ secrets.NAVI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NAVI_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$NAVI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Staging
        run: ssh -o IdentitiesOnly=yes root@${{ secrets.NAVI_HOST }} "staging $GITHUB_SHA"
      - name: Prod
        run: ssh -o IdentitiesOnly=yes root@${{ secrets.NAVI_HOST }} "prod $GITHUB_SHA"
