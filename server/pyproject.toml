[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jstudy"
version = "0.1.0"
description = "Backend for the Japanese study app: email-code login, Google sign-in, progress sync"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "pgserver==0.1.4",
]

[tool.setuptools.packages.find]
include = ["jstudy*"]

[tool.setuptools.package-data]
jstudy = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
