# /etc/nginx/sites-available/jstudy-prod.conf
# Same as staging with port 8081, kanjimo.shanewas.com, /srv/jstudy/www, upstream 8100 and no noindex header.
limit_req_zone  $binary_remote_addr zone=jstudy_prod_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=jstudy_prod_auth:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=jstudy_prod_conn:10m;
# Progress PUTs carry up to 1 MB each; the app sends one 1.5 s after the last answer at most.
map $request_method $jstudy_prod_put { PUT $binary_remote_addr; default ""; }
limit_req_zone  $jstudy_prod_put zone=jstudy_prod_put:10m rate=20r/m;

server {                                   # wrong Host on this port: drop
  listen 127.0.0.1:8081 default_server;
  server_name _;
  return 444;
}
server {
  listen 127.0.0.1:8081;
  server_name kanjimo.shanewas.com;
  root /srv/jstudy/www;
  set_real_ip_from 127.0.0.1;             # only cloudflared reaches this socket
  real_ip_header CF-Connecting-IP;
  server_tokens off;
  absolute_redirect off;                  # nginx would put its loopback :808x port into Location
  client_max_body_size 2m;
  gzip_static on;
  gzip on; gzip_vary on; gzip_types application/json application/javascript text/css;
  access_log /var/log/nginx/jstudy-prod.access.log;
  include snippets/jstudy-headers.conf;

  location = / { return 302 /app/; }
  location /app/   { include snippets/jstudy-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
  location /legal/ { include snippets/jstudy-headers.conf; add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
  location /about/ { include snippets/jstudy-headers.conf; add_header Cache-Control "public, max-age=3600" always; try_files $uri ${uri}index.html =404; }

  location /api/ {
    limit_req zone=jstudy_prod_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }
  location = /api/progress {
    limit_req zone=jstudy_prod_api burst=20 nodelay;
    limit_req zone=jstudy_prod_put burst=10 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }
  location /api/auth/ {
    limit_req zone=jstudy_prod_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /_auth/check      { internal; proxy_pass http://127.0.0.1:8100/api/auth/check;
    proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host; }
  location = /_auth/check-budget { internal; proxy_pass http://127.0.0.1:8100/api/auth/check-budget;
    proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host; }

  location = /data/index.json        { include snippets/jstudy-headers.conf; add_header Cache-Control "public, max-age=3600" always; }
  location = /data/LICENSE-DATA.txt  { include snippets/jstudy-headers.conf; }
  location = /data/ATTRIBUTION.json  { include snippets/jstudy-headers.conf; }
  location = /data/search-index.json {
    auth_request /_auth/check; limit_conn jstudy_prod_conn 8;
    include snippets/jstudy-headers.conf; add_header Cache-Control "private, max-age=86400" always;
  }
  # Levels 01 to 60 (MAX_LEVEL in jstudy/config.py): login plus the daily file budget.
  location ~ ^/data/(cards|items|levels|own)/level-(0[1-9]|[1-5][0-9]|60)\.json$ {
    auth_request /_auth/check-budget; limit_conn jstudy_prod_conn 8;
    include snippets/jstudy-headers.conf; add_header Cache-Control "private, max-age=86400" always;
  }
  location ~ "^/data/images/[a-z0-9-]{1,40}\.svg$" {
    auth_request /_auth/check; limit_conn jstudy_prod_conn 8;
    include snippets/jstudy-headers.conf; add_header Cache-Control "private, max-age=86400" always;
  }
  location ~ "^/media/audio/[a-f0-9]{16,64}\.(mp3|webm)$" {
    auth_request /_auth/check; limit_conn jstudy_prod_conn 8;
    include snippets/jstudy-headers.conf; add_header Cache-Control "private, max-age=31536000, immutable" always;
  }
  location /data/  { return 404; }
  location /media/ { return 404; }
  location ~ /\.   { return 404; }

  error_page 401 = @unauth;    location @unauth    { default_type application/json; return 401 '{"error":"login_required"}'; }
  error_page 403 = @forbidden; location @forbidden { default_type application/json; return 403 '{"error":"daily_limit"}'; }
}
